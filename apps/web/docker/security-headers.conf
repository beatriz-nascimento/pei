# Cabeçalhos de segurança, incluídos em cada location do default.conf.template.
# O nginx não herda add_header do server quando a location define o seu próprio
# (como Cache-Control), por isso eles não podem ficar só no bloco server.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy $csp always;
