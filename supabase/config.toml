# Configuração do Supabase local (`supabase start`). Em produção, o projeto é
# criado no painel do Supabase na região sa-east-1 (São Paulo) — ver docs/deploy.md.
project_id = "pei"

[api]
enabled = true
port = 54321
# Só o schema public é exposto pela API REST automática. O schema "private"
# (funções SECURITY DEFINER) fica de fora de propósito.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
# Caixa de e-mail falsa para testar login por link mágico localmente.
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:4200"
additional_redirect_urls = ["http://localhost:4200/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_expiry = 3600
