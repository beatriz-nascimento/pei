name: Deploy

# Homologação a cada push na main; produção manualmente (com aprovação
# configurada no environment "production" do GitHub).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation (sem chave JSON)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
      REGION: southamerica-east1
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      # 1. Migrações do banco no Supabase (antes da API nova subir).
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Aplicar migrações
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          supabase db push

      # 2. Imagens no Artifact Registry.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Definir nomes das imagens
        run: |
          REPO="$REGION-docker.pkg.dev/$PROJECT_ID/pei-$ENVIRONMENT"
          echo "API_IMAGE=$REPO/api:${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=$REPO/web:${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # 3. Novas revisões no Cloud Run (configuração e segredos vêm do Terraform).
      - name: Deploy da API
        run: gcloud run deploy "pei-$ENVIRONMENT-api" --image "$API_IMAGE" --region "$REGION" --quiet
      - name: Deploy do frontend
        run: gcloud run deploy "pei-$ENVIRONMENT-web" --image "$WEB_IMAGE" --region "$REGION" --quiet

      - name: Verificar saúde
        run: |
          URL=$(gcloud run services describe "pei-$ENVIRONMENT-api" --region "$REGION" --format 'value(status.url)')
          curl --fail --retry 5 --retry-delay 5 "$URL/health/ready"
